version: 2
updates:
  - package-ecosystem: pip
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      django:
        patterns:
          - "Django"
          - "django-*"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
