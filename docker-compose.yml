services:
  ddns:
    image: davd/docker-ddns:1.2.1
    restart: always
    environment:
      RECORD_TTL: 60
      ZONE: '${DOMAIN}'
      SHARED_SECRET: '${SHARED_SECRET}'
    ports:
      - "${DNS_PORT}:53"
      - "${DNS_PORT}:53/udp"
    volumes:
       - ./data/bind-data:/var/cache/bind
    networks:
      red:
  python:
    image: pyddns:5.2.0
    build: ./docker
    restart: always
    volumes:
      - ./appdata/pyddns:/usr/src/app
      - ./appdata/static/node_modules:/usr/src/app/static/node_modules
    environment:
      DNS_HOST: ddns
      DNS_API_PORT: 8080
      DNS_DOMAIN: '${DOMAIN}'
      DNS_SHARED_SECRET: '${SHARED_SECRET}'
      DNS_ALLOW_AGENT: '${DNS_ALLOW_AGENT}'
      DB_HOST: postgres
      DB_NAME: '${DATABASE_NAME}'
      DB_USER: '${DATABASE_USER}'
      DB_PASSWORD: '${DATABASE_PASS}'
      DJANGO_ADMIN_URL: '${DJANGO_ADMIN_URL}'
      DJANGO_SU_NAME: '${DJANGO_SU_NAME}'
      DJANGO_SU_EMAIL: '${DJANGO_SU_EMAIL}'
      DJANGO_SU_PASSWORD: '${DJANGO_SU_PASSWORD}'
      DJANGO_SECRET_KEY: '${DJANGO_SECRET_KEY}'
      DJANGO_DEBUG: '${DJANGO_DEBUG}'
      DJANGO_ALLOWED_HOSTS: '${DJANGO_ALLOWED_HOSTS}'
      DJANGO_SETTINGS_MODULE: '${DJANGO_SETTINGS_MODULE:-pyddns.settings.production}'
      DJANGO_LANGUAGE_CODE: '${DJANGO_LANGUAGE_CODE:-es-es}'
      DJANGO_TIME_ZONE: '${DJANGO_TIME_ZONE:-UTC}'
      OWN_ADMIN: '${OWN_ADMIN}'
      #MAX_DOMAINS_USER: '${MAX_DOMAINS_USER}'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.settimeout(3); s.connect((\"127.0.0.1\", 8000)); s.close()'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      red:

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASS}
      POSTGRES_USER: '${DATABASE_NAME}'
      POSTGRES_DB: '${DATABASE_USER}'
    volumes:
     - ./data/dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      red:

  nginx:
    image: nginx:1.27
    ports:
      - "${HTTP_PORT}:8000"
      - "${HTTPS_PORT}:8443"
    volumes:
      - ./config/nginx_src:/src
      - ./config/nginx:/etc/nginx/conf.d
      - ./appdata/static:/static
      - ./data/certs:/etc/nginx/certs
    depends_on:
      python:
        condition: service_healthy
    networks:
      red:

  # ---- Migration services (only run with COMPOSE_PROFILES=migration) ----
  # It is for PYDDNS2 users who were running with postgres 9.6 and want to upgrade to the latest PYDDNS with postgres 15.

  prep-migration:
    image: alpine:3.20
    volumes:
      - ./data:/data
    command: >
      sh -c '
      if [ ! -d /data/dbdata-old ] && [ -d /data/dbdata ]; then
        mv /data/dbdata /data/dbdata-old &&
        mkdir /data/dbdata &&
        echo "==> Renamed data/dbdata to data/dbdata-old; created empty data/dbdata for postgres 15";
      else
        echo "==> Pre-migration setup already in place (dbdata-old exists or dbdata missing); skipping";
      fi
      '
    profiles: ["migration"]

  postgres-old:
    image: postgres:9.6
    environment:
      POSTGRES_PASSWORD: '${DATABASE_PASS}'
      POSTGRES_USER: '${DATABASE_NAME}'
      POSTGRES_DB: '${DATABASE_USER}'
    volumes:
      - ./data/dbdata-old:/var/lib/postgresql/data
    depends_on:
      prep-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    profiles: ["migration"]
    networks:
      red:

  migrator:
    image: postgres:15
    environment:
      PGPASSWORD: '${DATABASE_PASS}'
      PGUSER: '${DATABASE_NAME}'
    depends_on:
      postgres-old:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      bash -c "
      set -e;
      echo '==> Dumping from postgres 9.6 (postgres-old)...';
      pg_dump --clean --if-exists -h postgres-old -d '${DATABASE_USER}' > /tmp/dump.sql;
      echo '==> Restoring into postgres 15 (postgres)...';
      psql -h postgres -d '${DATABASE_USER}' -v ON_ERROR_STOP=1 -f /tmp/dump.sql;
      echo '==> Migration complete!';
      "
    profiles: ["migration"]
    networks:
      red:

networks:
  red:

